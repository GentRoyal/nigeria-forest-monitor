repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.7
    hooks:
      - id: ruff-check
        files: ^(apps/|packages/forest_monitor/src/forest_monitor/(config|runtime)\.py|packages/forest_monitor/tests/test_core\.py)
      - id: ruff-format
        files: ^(apps/|packages/forest_monitor/src/forest_monitor/(config|runtime)\.py|packages/forest_monitor/tests/test_core\.py)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-json
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key
